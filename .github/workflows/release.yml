name: Release

# Builds ADBScreen.dmg via package.sh and publishes it.
#
# Signing/notarization only run when the Developer ID secrets below are
# configured in the repo (Settings -> Secrets and variables -> Actions).
# Without them, the workflow still builds an ad-hoc DMG artifact (useful
# for smoke-testing the packaging flow) but does NOT attach it to a
# release, since it wouldn't pass Gatekeeper on anyone else's Mac.
#
# Required secrets for real distribution:
#   DEVELOPER_ID_CERTIFICATE_P12       base64 of the exported .p12
#                                       (Developer ID Application cert + key)
#   DEVELOPER_ID_CERTIFICATE_PASSWORD  password the .p12 was exported with
#   KEYCHAIN_PASSWORD                  any throwaway password for the
#                                       temporary CI keychain
#   APPLE_TEAM_ID                      e.g. ABCDE12345
#   NOTARY_APPLE_ID                    Apple ID email used for notarization
#   NOTARY_APP_SPECIFIC_PASSWORD       app-specific password for that Apple ID
#                                       (generate at appleid.apple.com)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        id: import-cert
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "No Developer ID certificate secret configured — skipping import."
            echo "has_identity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/adbscreen-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed -E 's/^[0-9]+\) [A-F0-9]+ "(.+)"$/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "Imported certificate does not contain a 'Developer ID Application' identity." >&2
            exit 1
          fi

          rm -f "$CERT_PATH"
          echo "has_identity=true" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Store notarization credentials
        id: notary
        if: steps.import-cert.outputs.has_identity == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARY_APPLE_ID:-}" ] || [ -z "${NOTARY_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Notarization secrets incomplete — skipping notarization, DMG will only be signed."
            echo "has_profile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          xcrun notarytool store-credentials adbscreen-ci-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_APP_SPECIFIC_PASSWORD"
          echo "has_profile=true" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          DEVELOPER_ID_APPLICATION: ${{ steps.import-cert.outputs.identity }}
          NOTARY_PROFILE: ${{ steps.notary.outputs.has_profile == 'true' && 'adbscreen-ci-notary' || '' }}
        run: ./package.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADBScreen-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.notary.outputs.has_profile == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
