name: ADBScreen
options:
  bundleIdPrefix: com.felixbusch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  ADBScreen:
    type: application
    platform: macOS
    sources:
      - path: Sources/ADBScreen
        excludes:
          - "Info.plist"
          - "ADBScreen.entitlements"
          - "Resources/**"
      - path: Sources/ADBScreen/Resources/scrcpy-server
        buildPhase: resources
      - path: Sources/ADBScreen/Resources/adbscreen-airplay-helper
        buildPhase: resources
      - path: Sources/ADBScreen/Resources/adbscreen-usbmirror-helper
        buildPhase: resources
      - path: Sources/ADBScreen/Resources/libusb-1.0.0.dylib
        buildPhase: resources
      - path: Sources/ADBScreen/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Sources/ADBScreen/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: "ADBScreen wird zu einem AirPlay-Empfänger, damit dein iPhone/iPad den Bildschirm über das lokale Netzwerk spiegeln kann."
        NSBonjourServices:
          - "_airplay._tcp"
          - "_raop._tcp"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        CFBundleDisplayName: ADBScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.felixbusch.adbscreen
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: Sources/ADBScreen/ADBScreen.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
